<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout with Snow</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #fff;
            position: relative;
            overflow-x: hidden;
        }

        /* Базовый класс для красных блоков */
        .item {
            background-color: #ff3b30;
            border: 1px solid #000;
            margin-bottom: 10px;
        }

        /* Размеры айтемов под макет */
        .header-item { height: 50px; }
        .sidebar-left-item { height: 40px; }
        .content-item { height: 40px; }
        .sidebar-right-item { height: 120px; }
        .footer-item { height: 80px; }

        /* Цвета фонов секций как на схеме */
        .header-bg, .content-bg, .footer-bg {
            background-color: #d0e1f9;
            border: 1px solid #333;
            padding: 15px;
        }
        .sidebar-bg {
            background-color: #e3eed4;
            border: 1px solid #333;
            padding: 15px;
        }

        /* Контейнер для снега */
        #snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
    </style>

    <!-- Подключаем jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <script>
        window.onload = function() {
            snow(1);
        }

        function snow(id) {
            var pos_x = Math.random() * (99 - 1) + 1;
            pos_x = Math.floor(pos_x);
            var q = 10;
            var png_sh = 0;

            if (pos_x >= 1 && pos_x <= 10)   { q = -10; png_sh = 1; }
            if (pos_x > 10 && pos_x <= 20)  { q = 10;  png_sh = 3; }
            if (pos_x > 20 && pos_x <= 30)  { q = -10; png_sh = 0; }
            if (pos_x > 30 && pos_x <= 40)  { q = 10;  png_sh = 2; }
            if (pos_x > 40 && pos_x <= 50)  { q = -10; png_sh = 1; }
            if (pos_x > 50 && pos_x <= 60)  { q = 10;  png_sh = 3; }
            if (pos_x > 60 && pos_x <= 70)  { q = -10; png_sh = 0; }
            if (pos_x > 70 && pos_x <= 80)  { q = 10;  png_sh = 2; }
            if (pos_x > 80 && pos_x <= 90)  { q = -10; png_sh = 1; }
            if (pos_x > 90 && pos_x <= 99)  { q = 10;  png_sh = 3; }
            
            var end_x = pos_x + q;
            
            // Если вдруг расширение файлов большое (.PNG), поменяй тут на .PNG
            var imgSrc = "images/snow_" + png_sh + ".png";
            
            var img = "<img id='snow_" + id + "' style='left:" + pos_x + "%; top:-10%; position:fixed; width:25px; height:25px;' src='" + imgSrc + "' onerror='console.error(\"Не удалось загрузить картинку: \" + this.src);'/>";
            
            $("#snow").append(img);
            move_show(id, end_x);
            id++;
            setTimeout(function() { snow(id); }, 200);
        }

        function move_show(id, end_x) {
            $("#snow_" + id).animate({
                top: "110%",
                left: end_x + "%"
            }, 15000, function() {
                $("#snow_" + id).remove();
            });
        }
    </script>
</head>
<body>

    <div id="snow"></div>

    <div class="container-fluid p-3">
        
        <!-- HEADER -->
        <header class="header-bg mb-2">
            <div class="row g-2">
                <div class="col-2"><div class="item header-item"></div></div>
                <div class="col-2"><div class="item header-item"></div></div>
                <div class="col-2"><div class="item header-item"></div></div>
                <div class="col-2"><div class="item header-item"></div></div>
                <div class="col-2"><div class="item header-item"></div></div>
                <div class="col-2"><div class="item header-item"></div></div>
            </div>
        </header>

        <!-- СРЕДНЯЯ СЕКЦИЯ -->
        <div class="row g-2 align-items-stretch mb-2">
            
            <!-- ЛЕВЫЙ САЙДБАР -->
            <nav class="col-2 sidebar-bg">
                <div class="item sidebar-left-item"></div>
                <div class="item sidebar-left-item"></div>
                <div class="item sidebar-left-item"></div>
            </nav>

            <!-- ЦЕНТРАЛЬНЫЙ КОНТЕНТ -->
            <main class="col-8 content-bg d-flex flex-column">
                <div class="row g-2 mb-4">
                    <div class="col-3"><div class="item content-item"></div></div>
                    <div class="col-3"><div class="item content-item"></div></div>
                    <div class="col-3"><div class="item content-item"></div></div>
                    <div class="col-3"><div class="item content-item"></div></div>
                </div>
                <div class="flex-grow-1"></div>
            </main>

            <!-- ПРАВЫЙ САЙДБАР -->
            <aside class="col-2 sidebar-bg">
                <div class="item sidebar-right-item"></div>
                <div class="item sidebar-right-item"></div>
            </aside>

        </div>

        <!-- FOOTER -->
        <footer class="footer-bg">
            <div class="row g-3">
                <div class="col-4"><div class="item footer-item"></div></div>
                <div class="col-4"><div class="item footer-item"></div></div>
                <div class="col-4"><div class="item footer-item"></div></div>
            </div>
        </footer>

    </div>

</body>
</html>
