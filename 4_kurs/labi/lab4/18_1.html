<!DOCTYPE html>
<html>

<head>
    <title>Удаляющееся изображение</title>
    <script>
        var h = 200
        var d = document
        function succpict() {
            if (h > 100) {
                h = h - 10
                d.images[0].height = h
                setTimeout("succpict()", 500)
            }
        }
    </script>
</head>

<body>
    <H4>При наведении курсора мыши на рисунок<br>
        изображение начинает удаляться от зрителя </H4>
    <img src="images/brest_zhazhda.jpg" name=mypict height=200 onMouseOver="succpict()">
</body>

</html>
