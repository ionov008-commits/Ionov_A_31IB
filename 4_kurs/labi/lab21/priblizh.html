<!DOCTYPE html>
<html>
<head>
    <title>Приближающееся изображение</title>
    <script>
        var h = 200
        var d = document
        function succpict() {
            if (h < 400) {
                h = h + 10;
                d.images[0].height = h;
                setTimeout("succpict()", 500);
            }
        }
    </script>
</head>
<body>
    <h4>При наведении курсора мыши на рисунок<br> изображение начинает приближаться к зрителю </h4>
    <img src="images/brest_zhazhda.jpg" name=mypict height=200 onMouseOver="succpict()">
</body>
</html>
