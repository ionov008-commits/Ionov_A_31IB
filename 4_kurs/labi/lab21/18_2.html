<!DOCTYPE html>
<html>

<head>
    <title>Смена изображений</title>
</head>
<script>
    const images = [
        "images/pojaspersidski.jpg", "images/_1.jpg", "images/_2.jpg", "images/146_3.jpg",
        "images/153_p.jpg", "images/160_p.jpg", "images/163_p.jpg", "images/154_p.jpg",
        "images/159_p.jpg", "images/149_p.jpg", "images/146_4.jpg", "images/146_p_orn.jpg",
        "images/pojasvasilek.jpg"
    ];

    let numimg = 0;
    let imgslide = images.map(src => {
        let img = new Image();
        img.src = src;
        return img;
    });
    function demoslides() {
        document.images[0].src = imgslide[numimg].src
        numimg++
        if (numimg == 13)
            numimg = 0;
        setTimeout("demoslides()", 1000)
    }
</script>

<body bgcolor="#FFFFFF">
    <p><img src="images/155_p.jpg" width="420" height="500"></p>
    <input type="button" value="Демонстрация слуцких поясов" onclick="demoslides()" />
</body>

</html>
