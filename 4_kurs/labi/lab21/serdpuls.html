<!DOCTYPE html>
<html>
<head>
    <title>Пульсирующее изображение</title>
    <script>
        var h = 200;
        var step = 10;
        var d = document;
        function succpict() {
            h = h + step;
            if (h >= 300 || h <= 100) {
                step = -step;
            }
            d.images[0].height = h;
            setTimeout("succpict()", 300);
        }
    </script>
</head>
<body>
    <h4>При наведении курсора мыши на рисунок<br> изображение начинает пульсировать </h4>
    <img src="images/serde4ko.gif" name=mypict height=200 onMouseOver="succpict()">
</body>

</html>
