<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function test(){
            let str = 'Я люблю js';
            let regexp1 = /люблю/;
            alert(regexp1.test(str));
            let regexp2 = /люблю/i;
            alert(regexp2.test(str));
        }
    </script>
</head>
<body>
    <input type="button" value='abavagaga' onclick="test()">
</body>
</html>
