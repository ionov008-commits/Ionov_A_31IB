<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function createWindow(){
            let myWin=open('', '', 'width=400, height=100, toolbar=no, menubar=no');
            myWin.document.open();
            myWin.document.write('<html><body><font size=+3>');
            myWin.document.write('Hello');
            myWin.document.write('</font></body></html>');
            myWin.document.close();
        }
    </script>
</head>
<body>
    <input type="button" value="otrkit okno i sozdat v nem document" onClick="createWindow();"> <br><br>
    последнее изменение документа было:
    <script>
        document.write(document.lastModified);
        document.close();
    </script>
</body>
</html>
