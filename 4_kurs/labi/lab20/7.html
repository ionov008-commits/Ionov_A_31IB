<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="box" style="position:absolute; left:20px; top:50px; width:100px; height:100px; font-size:14px; background:lightblue;">
        Текст
    </div>

    <button onclick="toggleStyle()" style="margin-top:150px;">Изменить стиль</button>

    <script>
        function toggleStyle() {
            let el = document.getElementById('box');
            if (el.style.left === '150px') {
                el.style.left = '20px';
                el.style.top = '50px';
                el.style.width = '100px';
                el.style.height = '100px';
                el.style.fontSize = '14px';
            } else {
                el.style.left = '150px';
                el.style.top = '100px';
                el.style.width = '200px';
                el.style.height = '150px';
                el.style.fontSize = '24px';
            }
        }
    </script>
</body>
</html>
