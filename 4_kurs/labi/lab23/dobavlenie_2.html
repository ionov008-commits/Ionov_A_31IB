<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Добавление элемента (insertBefore)</title>
</head>

<body>
    <p>Text 1</p>
    <p>Text 2</p>
    <script>
        const header = document.createElement("h1");
        header.textContent = "Page Header";
        const firstP = document.body.firstElementChild;
        document.body.insertBefore(header, firstP);  
    </script>
</body>

</html>
