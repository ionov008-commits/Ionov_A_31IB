<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Копирование элемента</title>
</head>

<body>
    <div id="article">
        <h1>Home Page</h1>
        <p>Text 1</p>
        <p>Text 2</p>
    </div>
    <script>
        const article = document.getElementById("article");
        const lastP = article.lastElementChild;
        const newLastP = lastP.cloneNode(true);
        newLastP.textContent = "Publication Date: 21/12/2025";
        article.appendChild(newLastP); 
    </script>
</body>

</html>
