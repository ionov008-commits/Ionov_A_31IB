<html>

<head>
    <title>Пример 29. Перетаскивание</title>
    <script>
        var ob;

        function dn(e) {
            e = e || event;
            ob = e.target || e.srcElement;
            document.onmousemove = mv;
            document.onmouseup = up;
            return false;
        }

        function mv(e) {
            e = e || event;
            if (ob) {
                ob.style.left = e.clientX - 50 + 'px';
                ob.style.top = e.clientY - 50 + 'px';
            }
            return false;
        }

        function up() {
            ob = null;
            document.onmousemove = null;
            document.onmouseup = null;
        }
    </script>
</head>

<body style="background: brown;" ondragstart="return false" onselectstart="return false" onmousedown="dn(event)">
    <p style="width:100px; position:absolute; top:100px; left:500px; font-family: Arial; color:white;">Перетаскивай!!!</p>
    <img src="images/pic1.gif" style="height:150px; position:absolute; top:200px; left:200px;">
    <img src="images/pic2.gif" style="height:150px; position:absolute; top:30px; left:30px;">
    <div style="position:absolute; top:350px; left:450px; width:280px; height:70px; background-color:green;"></div>
</body>

</html>
