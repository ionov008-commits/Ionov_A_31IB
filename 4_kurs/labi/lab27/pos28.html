<html>

<head>
    <title>Пример 28</title>
    <script>
        var ob;

        function fover(e) {
            e = e || event;
            ob = e.target || e.srcElement;
            document.title = ob.tagName;
        }

        function func1() {
            document.getElementById("tp1").style.backgroundColor = "pink";
            document.getElementById("tp1").value = "Вы нажали первую кнопку";
            
            // Включаем прослушивание события onmouseover на уровне document
            document.onmouseover = fover;
        }

        function func2() {
            document.getElementById("tp1").style.backgroundColor = "lightblue";
            document.getElementById("tp1").value = "Вы нажали вторую кнопку";
        }

        function func3() {
            document.getElementById("tp1").style.backgroundColor = "lightgreen";
            document.getElementById("tp1").value = "Вы нажали третью кнопку";
            
            // Выключаем прослушивание события и возвращаем исходный заголовок
            document.onmouseover = null;
            document.title = "Пример 28";
        }
    </script>
</head>

<body style="background-color : green">
    <p style="color:yellow">Пример использования формы с кнопками</p>
    <form>
        <input id="tp1" type="text" size=32 value=""><br> 
        <input style="background-color: pink;" type="button" value="Первая" onclick="func1()">
        <input style="background-color: lightblue;" type="button" value="Вторая" onclick="func2()">
        <input style="background-color: lightgreen;" type="button" value="Tретья" onclick="func3()">
    </form>
    <img src="images/pic1.gif" style="height:150px;">
</body>

</html>
