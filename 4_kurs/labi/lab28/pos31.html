<html>

<head>
    <title>Пример 31</title>
    <script>
        var dx = 10;
        var sf3;
        var flag = true;

        function func1() {
            if (flag) {
                sf3 = setInterval("func3()", 20);
                flag = false;
            }
        }

        function func2() {
            clearInterval(sf3);
            flag = true;
        }

        function func3() {
            var nleft = parseInt(document.getElementById('ball').style.left) + dx;
            document.getElementById('ball').style.left = nleft + 'px';

            if (nleft >= 360) dx = -dx;
            if (nleft <= 0) dx = -dx;
        }
    </script>
</head>

<body style="background-color : green">
    <p style="color:yellow">Пример использования формы с кнопками</p>
    <form>
        <input type="button" value="Пуск" onclick="func1()">
        <input type="button" value="Стоп" onclick="func2()">
    </form>
    
    <div style="background-color:lightblue; position:absolute; top:150px; left:50px; width:400px; height:300px;">
        <img id="ball" src="ball.png" style="position:absolute; top:130px; left:180px; height:40px;">
    </div>
</body>

</html>
