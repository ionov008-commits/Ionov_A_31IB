<html>

<head>
    <title>Пример 11</title>
    <script>
        function func1() {
            alert(document.title);
        }
        function func2() {
            alert(document.URL);
        }
        function func3() {
            document.title = "Новый заголовок"; //alert('Вы нажали на третью кнопку');
        }
    </script>
</head>

<body style="background-color: green;">
    <p style="color:yellow">Пример ипользования формы с кнопками</p>
    <form>
        <input type="button" value="Первая" onclick="func1()">
        <input type="button" value="Вторая" onclick="func2()">
        <input type="button" value="Третья" onclick="func3()">
    </form>
</body>

</html>
