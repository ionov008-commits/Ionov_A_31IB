<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пример 39</title>
    <script>
        var dd = ":";

        function clock() {
            var data = new Date();
            var h = data.getHours();
            var min = data.getMinutes();

            if (parseInt(h) < 10) h = "0" + h;
            if (parseInt(min) < 10) min = "0" + min;

            document.getElementById("c1").innerHTML = h + dd + min;

            if (dd == ":") dd = " ";
            else dd = ":";
        }
    </script>
</head>
<body onload="setInterval('clock()', 500);">

    <div id="c1" style="font-size: 28px; font-family: Arial; background: white; height: 30px; width: 150px; border: 7px double black; text-align: center;">
        00:00
    </div>

</body>
</html>
