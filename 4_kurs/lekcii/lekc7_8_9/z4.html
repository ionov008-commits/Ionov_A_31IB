<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 4</title>
    <script>
        var dd = ":";

        function clock() {
            var data = new Date();
            var h = data.getHours();
            var min = data.getMinutes();
            var sec = data.getSeconds();

            if (parseInt(h) < 10) h = "0" + h;
            if (parseInt(min) < 10) min = "0" + min;
            if (parseInt(sec) < 10) sec = "0" + sec;

            document.getElementById("c1").innerHTML = h + dd + min + dd + sec;

            if (dd == ":") dd = " ";
            else dd = ":";
        }

        // Логика перетаскивания
        function makeDraggable(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }
    </script>
</head>
<body onload="setInterval('clock()', 500); makeDraggable(document.getElementById('c1'));">
    <div id="c1" style="position: absolute; cursor: move; font-size: 28px; font-family: Arial; background: white; height: 30px; width: 200px; border: 7px double black; text-align: center;">
        23:45:00
    </div>
</body>
</html>
