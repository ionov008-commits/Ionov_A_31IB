<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пример 41</title>
    <script>
        function writeCookie(name, value, days) {
            var expires = "";
            if (days) {
                var date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function readCookie(name) {
            var nameEQ = name + "=";
            var ca = document.cookie.split(';');
            for (var i = 0; i < ca.length; i++) {
                var c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function func1() {
            document.getElementById("pp1").value = "";
        }

        function func2() {
            var text = document.getElementById("pp1").value;
            var name = text.split(";")[0];
            var value = text.split(";")[1];
            var ds = text.split(";")[2];

            writeCookie(name, value, ds);
            document.getElementById("pp1").value = "";
        }

        function func3() {
            var name = document.getElementById("pp1").value;
            document.getElementById("pp1").value = name + '=' + readCookie(name);
        }
    </script>
</head>
<body style="background-color: green;">
    <p style="color: yellow;">Пример использования cookie</p>
    <form>
        <input id="pp1" type="text" size="80" value=""><br> 
        <input style="background-color: pink;" type="button" value="Очистить" onclick="func1()">
        <input style="background-color: lightblue;" type="button" value="Записать" onclick="func2()">
        <input style="background-color: lightgreen;" type="button" value="Вывести" onclick="func3()">
    </form>
</body>
</html>
