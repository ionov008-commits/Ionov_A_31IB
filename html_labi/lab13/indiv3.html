<!DOCTYPE html>
<html>
<head>
    <title>Проверка фамилии</title>
</head>
<body>
    <input type="text" id="fam" placeholder="Введите фамилию">
    <button onclick="check()">Проверить</button>
    <p id="out"></p>

    <script>
        function check() {
            let text = document.getElementById("fam").value;
            let ok = true;
            
            for(let i = 0; i < text.length; i++) {
                let c = text[i];
                if(c >= '0' && c <= '9') {
                    ok = false;
                    break;
                }
                if(c == '!' || c == '@' || c == '#' || c == '$' || c == '%' || c == '—') {
                    ok = false;
                    break;
                }
            }
            
            if(ok && text != "") {
                document.getElementById("out").innerHTML = "Верно: " + text;
            } else {
                document.getElementById("out").innerHTML = "Ошибка! Без цифр и знаков!";
            }
        }
    </script>
</body>
</html>
