<!DOCTYPE html>
<html>
<head>
<title>Clocks</title>
<meta charset="windows-1251">
<script>
function format(num) {
    return num < 10 ? '0' + num : num;
}

function clock() {
    var now = new Date();
    var ch = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();

    var timeString = format(ch) + ":" + format(m) + ":" + format(s);

    document.forms[0].elements[0].value = timeString;

    setTimeout("clock()", 1000);
}
</script>
</head>
<body onLoad="clock()">
    <form name="form1">
        <input type="text" size="10">
    </form>
</body>
</html>
