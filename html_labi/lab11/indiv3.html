<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра «Угадай число»</title>
    <script>
        const target = Math.floor(Math.random() * 10) + 1;
        let step = 1;

        function check(e) {
            if (e.key === 'Enter') {
                let input = document.getElementById('guess');
                let log = document.getElementById('log');
                let val = parseInt(input.value);

                if (isNaN(val) || val < 1 || val > 10) return;

                log.innerHTML += `→ ${val}<br>`;

                if (val === target) {
                    log.innerHTML += `<font color="green">Вы выиграли! Поздравляю.</font><br>`;
                    input.disabled = true;
                    return;
                } else {
                    log.innerHTML += `<font color="red">Нет.</font><br>`;
                }

                step++;
                if (step > 5) {
                    log.innerHTML += `<b>Конец игры! Число было: ${target}</b>`;
                    input.disabled = true;
                }
                input.value = '';
            }
        }
    </script>
</head>
<body>

    <p>Игра «Угадай число».<br>
    Компьютер «задумал» число от 1 до 10.<br>
    Угадайте его за 5 попыток.<br>
    Введите число и нажмите &lt;enter&gt;</p>

    <input type="number" id="guess" onkeydown="check(event)">

    <div id="log"></div>

</body>
</html>
