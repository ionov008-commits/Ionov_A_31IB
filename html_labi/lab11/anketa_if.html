<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let surname = prompt('введите вашу фамилию:');
        let firstname = prompt('введите ваше имя:');
        let fathername = prompt('введите ваше отчество');
        let FIO = surname + ' ' + firstname + ' ' + fathername;
        let age = prompt('введите ваш возраст:');
        let agedays = Number(age) * 365;
        let agefiveyears = Number(age) + 5;
        let male = confirm('ваш пол - мужской?');
        let sex;
        let pensionAge;
        let pensionFact;
        if(male === true){
            sex = "Мужской";
            pensionAge = 63;
        }
        else if (male === false){
            sex = "Женский";
            pensionAge = 58;
        }
        if(age >= pensionAge){
            pensionFact = "Да"
        }
        else if(age < pensionAge){
            pensionFact = "Нет"
        }
        alert("Ваше ФИО: " + FIO + '\n' +
        "Ваш возраст в годах: " + age + '\n' +
        "Ваш возраст в днях: " + agedays + '\n' +
        "Через пять лет вам будет: " + agefiveyears + '\n' +
        "Ваш пол: " + sex + '\n' +
        "Вы на пенсии: " + pensionFact + '\n'
        )
    </script>
</head>

</body>
</html>
