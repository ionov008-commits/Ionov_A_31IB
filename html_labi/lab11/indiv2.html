<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function f1(){
            let day = Number(document.getElementById('day').value);
            let time = Number(document.getElementById('time').value);
            let skidka = document.getElementById('skidka');
            let cost = 1;
            let totalcost;
            if(day > 5){
                skidka.hidden = false;
                totalcost = time * cost * 0.8;
            }
            else{
                skidka.hidden = true;
                totalcost = time * cost;
            }
            document.getElementById('result').innerText = totalcost.toFixed(2);
        }
    </script>
</head>
<body><h1 onClick="f1();">Вычисление стоимости разговора по телефону:</h1>

    <p>Введите исходные данные:</p>
    
    <label>Длительность разговора (целое количество минут) →</label>
    <input type="number" id="time" value="0" step="any"><br><br>
    
    <label>День недели (1-7) →</label>
    <input type="number" id="day" value="1" min="1" max="7" step="1"><br><br>
    
    <p>
        <i id="skidka" style="color: violet" hidden>Предоставляется скидка 20%</i><br>
        Стоимость разговора: <span id="result"></span> руб.
    </p>
</body>
</html>
