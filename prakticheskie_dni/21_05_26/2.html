<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Убирает полосы прокрутки, если они появятся */
            background-color: #fff; /* Белый фон под гифкой */
        }
        .fullscreen-gif {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Гифка впишется целиком без искажения пропорций. Если нужно растянуть в край со срезом лишнего — замени на cover */
        }
    </style>
</head>
<body>
    <img src="images/4.gif" class="fullscreen-gif" alt="gif">
</body>
</html>
